<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proxy By Domain</title>

    <link href="assets/lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/popup.css" rel="stylesheet">
</head>
<body style="display: none;">

<div class="container-fluid bg-light p-0">
    <nav class="border-bottom">
        <div class="nav nav-tabs" id="nav-tab" role="tablist">
            <button class="nav-link active" id="nav-list-tab" data-bs-toggle="tab" data-bs-target="#nav-list" type="button" role="tab" aria-controls="nav-list" aria-selected="true">
                __MSG_TEXT_PROXY_LIST__
            </button>
            <button class="nav-link" id="nav-import-tab" data-bs-toggle="tab" data-bs-target="#nav-import" type="button" role="tab" aria-controls="nav-import" aria-selected="false">
                __MSG_TEXT_IMPORT_PROXY__
            </button>
            <button class="nav-link" id="nav-rules-tab" data-bs-toggle="tab" data-bs-target="#nav-rules" type="button" role="tab" aria-controls="nav-rules" aria-selected="false">
                __MSG_TEXT_DOMAIN_RULES__
            </button>
            <button class="nav-link" id="nav-settings-tab" data-bs-toggle="tab" data-bs-target="#nav-settings" type="button" role="tab" aria-controls="nav-settings" aria-selected="false">
                __MSG_TEXT_SETTINGS__
            </button>
        </div>
    </nav>

    <div class="tab-content" id="nav-tabContent">
        <div class="tab-pane fade show active" id="nav-list" role="tabpanel" aria-labelledby="nav-list-tab" tabindex="0">
            <div class="card card-body border-0">

                <button type="button" class="btn btn-secondary mb-3 resetProxy" id="resetProxy">
                    __MSG_TEXT_BTN_DISABLE_PROXY__
                </button>

                <table class="table table-sm table-hover table-bordered m-0 proxy_list">
                    <thead>
                    <tr>
                        <th style="width: 1px"></th>
                        <th style="min-width: 110px">IP</th>
                        <th style="min-width: 60px">PORT</th>
                        <th>LOGIN</th>
                        <th>PASSWORD</th>
                        <th>NOTE</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td colspan="6" class="text-center">Empty</td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>

        <div class="tab-pane fade" id="nav-import" role="tabpanel" aria-labelledby="nav-import-tab" tabindex="0">
            <div class="card card-body border-0">

                <div class="d-grid gap-2">
                    <div>
                        <div class="accordion" id="importHelp">
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed shadow-none p-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapseImportHelp" aria-expanded="false" aria-controls="collapseImportHelp">
                                        __MSG_TEXT_EXAMPLE__
                                    </button>
                                </h2>
                                <div id="collapseImportHelp" class="accordion-collapse collapse" data-bs-parent="#importHelp">
                                    <div class="accordion-body p-2">
                                <textarea class="form-control shadow-none" rows="5" style="resize: none;" readonly>ip:port
ip:port:login:password
login:password@ip:port
# comment 1
login:password@ip:port # comment 2</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="import_proxy" class="form-label">__MSG_TEXT_PROXY_LIST__</label>
                        <textarea class="form-control shadow-none" id="import_proxy" name="import_proxy" rows="12"></textarea>
                    </div>

                    <div>
                        <button type="button" class="btn btn-warning w-100 saveProxy">__MSG_TEXT_BTN_SAVE__</button>
                    </div>
                </div>

            </div>
        </div>

        <div class="tab-pane fade" id="nav-rules" role="tabpanel" aria-labelledby="nav-rules-tab" tabindex="0">
            <div class="card card-body border-0">

                <p class="m-0 mb-2 text-body-secondary small" data-i18n="TEXT_DOMAIN_RULES_INFO"></p>

                <div class="border rounded p-2 mb-3 domain_rule_form">
                    <div class="row g-2 align-items-end">
                        <div class="col-sm-4">
                            <label for="rule_pattern" class="form-label mb-1 small" data-i18n="TEXT_DOMAIN_PATTERN"></label>
                            <input type="text" class="form-control form-control-sm font-monospace" id="rule_pattern" placeholder="example.com">
                        </div>
                        <div class="col-sm-4">
                            <label for="rule_proxy" class="form-label mb-1 small" data-i18n="TEXT_DOMAIN_PROXY"></label>
                            <select class="form-select form-select-sm font-monospace" id="rule_proxy">
                                <option value="" data-i18n="TEXT_DOMAIN_PROXY_SELECT"></option>
                            </select>
                        </div>
                        <div class="col-sm-3">
                            <label for="rule_note" class="form-label mb-1 small" data-i18n="TEXT_DOMAIN_NOTE"></label>
                            <input type="text" class="form-control form-control-sm" id="rule_note">
                        </div>
                        <div class="col-sm-1">
                            <button type="button" class="btn btn-warning btn-sm w-100 addDomainRule" data-i18n="TEXT_BTN_ADD"></button>
                        </div>
                    </div>
                </div>

                <table class="table table-sm table-hover table-bordered m-0 domain_rules">
                    <thead>
                    <tr>
                        <th style="width: 1px"></th>
                        <th data-i18n="TEXT_DOMAIN_PATTERN"></th>
                        <th data-i18n="TEXT_DOMAIN_PROXY"></th>
                        <th data-i18n="TEXT_DOMAIN_NOTE"></th>
                        <th style="width: 1px"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td colspan="5" class="text-center domain_rules_empty" data-i18n="TEXT_DOMAIN_RULES_EMPTY"></td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>

        <div class="tab-pane fade" id="nav-settings" role="tabpanel" aria-labelledby="nav-settings-tab" tabindex="0">
            <div class="card card-body border-0">

                <div class="d-grid gap-2">
                    <div>
                        <p class="m-0">__MSG_TEXT_SETTINGS_INFO__</p>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="reload_current_tab">
                            <label class="form-check-label" for="reload_current_tab">__MSG_CH_RELOAD_CURRENT_TAB__</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="reload_other_tabs">
                            <label class="form-check-label" for="reload_other_tabs">__MSG_CH_RELOAD_OTHER_TABS__</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="remove_cookies">
                            <label class="form-check-label" for="remove_cookies">__MSG_CH_REMOVE_COOKIES__</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="remove_cache">
                            <label class="form-check-label" for="remove_cache">__MSG_CH_REMOVE_CACHE__</label>
                        </div>
                    </div>

                    <div>
                        <label for="exclude_urls" class="form-label">__MSG_TEXT_EXCLUDE_URLS__</label>
                        <textarea class="form-control shadow-none" id="exclude_urls" name="exclude_urls" rows="10"></textarea>
                    </div>

                    <div>
                        <button type="button" class="btn btn-warning w-100 i_do_nothing">__MSG_TEXT_BTN_SAVE__</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="font-monospace text-end py-1 px-3 text-body-secondary copyright">
            __MSG_TEXT_WITH__
            <svg width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-heart-fill text-danger" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314z"/>
            </svg>
            __MSG_TEXT_BY__ <a href="https://github.com/khoazero123/simple-proxy-switcher" id="copyright_link">Developer</a>
        </div>

    </div>
</div>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/popup.js"></script>

</body>
</html>
